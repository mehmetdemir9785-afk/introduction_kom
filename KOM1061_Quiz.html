:root{
  --paper:#edf2e1; --grid:rgba(38,120,66,.13); --grid-strong:rgba(38,120,66,.2);
  --ink:#18222d; --muted:#586556; --rule:#18222d;
  --pen:#1f3fbf; --pen-soft:rgba(31,63,191,.09);
  --ok:#1b7745; --bad:#c23b22;
  --serif:"LM Roman","Latin Modern Roman","CMU Serif",Georgia,"Times New Roman",serif;
  --sans:"LM Sans","Latin Modern Sans","Gill Sans","Trebuchet MS",Verdana,sans-serif;
  --cell:22px;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0;color:var(--ink);font:17px/1.5 var(--sans);min-height:100vh;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:calc(var(--cell)*5) calc(var(--cell)*5),calc(var(--cell)*5) calc(var(--cell)*5),var(--cell) var(--cell),var(--cell) var(--cell);
  background-position:-1px -1px;
}
.sheet{max-width:744px;margin:0 auto;padding:22px 22px 88px}
.runhead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:15px;
  border-bottom:3px double var(--rule);padding-bottom:8px;margin-bottom:44px}
.runhead b{font-family:var(--serif);font-size:18px;letter-spacing:.01em}
.runhead .who{text-align:right;color:var(--muted)}
h1{font:700 44px/1.08 var(--serif);margin:0 0 14px;letter-spacing:-.01em}
h2{font:700 24px/1.2 var(--serif);margin:52px 0 12px}
p{margin:0 0 12px;max-width:62ch}
.lede{font:400 21px/1.45 var(--serif)}
.muted{color:var(--muted)}
.small{font-size:15px}
i,em{font-family:var(--serif);font-style:italic}

/* buttons */
button{font:inherit;color:inherit;cursor:pointer}
.btn{font:700 16px/1 var(--sans);padding:13px 20px;border:1.5px solid var(--ink);background:transparent;border-radius:2px}
.btn:hover{background:rgba(24,34,45,.07)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:#f4f7ea}
.btn.primary:hover{background:#17309a;border-color:#17309a}
.btn:disabled{opacity:.38;cursor:not-allowed}
.textbtn{border:0;background:none;padding:0;color:var(--pen);text-decoration:underline;text-underline-offset:3px;font-size:16px}
.textbtn:hover{text-decoration-thickness:2px}
.textbtn.danger{color:var(--bad)}
:focus-visible{outline:2.5px solid var(--pen);outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin-top:24px}
.links{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:10px}
kbd{font:400 13px/1 var(--sans);border:1px solid var(--muted);border-bottom-width:2px;border-radius:3px;padding:3px 6px;color:var(--muted);background:rgba(255,255,255,.35)}

/* cover */
.course{font:400 23px/1.3 var(--serif);margin:0 0 6px}
.loop{display:block;width:100%;height:auto;margin:34px 0 26px}
.loop text{font-family:var(--sans);font-size:15px;fill:var(--ink)}
.loop .it{font-family:var(--serif);font-style:italic;font-size:17px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 34px;margin-top:34px}
.field label{display:block;font-size:15px;color:var(--muted)}
.field input{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--pen);
  font:italic 400 28px/1.3 var(--serif);padding:6px 2px 4px;border-radius:0}
.field input:focus{outline:0;border-bottom:3px solid var(--pen);padding-bottom:2.5px}
.notice{border-left:3px solid var(--bad);padding:4px 0 4px 14px;margin-top:22px;font-size:15px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:9px 10px 9px 0;border-bottom:1px solid rgba(24,34,45,.28)}
thead th{font-weight:400;color:var(--muted);border-bottom:1.5px solid var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* plots */
.plot{display:block;width:100%;height:auto;overflow:visible}
.plot text{font-family:var(--sans);font-size:13px;fill:var(--muted)}
.plot .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
.plot .gl{stroke:rgba(24,34,45,.22);stroke-width:1;stroke-dasharray:2 4}
.plot .trace{stroke:var(--pen);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.plot .target{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:7 5}
.plot .err{stroke:var(--bad);stroke-width:1.6}
.plot .errt{fill:var(--bad);font-size:14px}
.plot .lab{fill:var(--ink);font-size:14px}
.plot .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.7s cubic-bezier(.3,.1,.3,1) .15s forwards}
.plot .late{opacity:0;animation:fadein .5s 1.7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}

/* question map */
.qmap{display:grid;grid-template-columns:repeat(40,1fr);gap:3px;margin:14px 0 10px}
.qmap i{aspect-ratio:1;border:1px solid rgba(24,34,45,.4);background:rgba(255,255,255,.3)}
.qmap i.on{background:var(--pen);border-color:var(--pen)}
.legend{display:flex;gap:22px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border:1px solid rgba(24,34,45,.4);margin-right:7px;vertical-align:-1px;background:rgba(255,255,255,.3)}
.legend span.on::before{background:var(--pen);border-color:var(--pen)}

/* exam question */
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font:italic 400 19px/1.3 var(--serif)}
.qmeta .topic{color:var(--muted);text-align:right}
.ticks{display:flex;gap:0;margin:10px 0 40px;border-bottom:1.5px solid var(--ink);height:14px;align-items:flex-end}
.ticks i{flex:1;height:6px;border-left:1.5px solid var(--ink)}
.ticks i:last-child{border-right:1.5px solid var(--ink)}
.ticks i.done{height:14px;background:var(--pen-soft);border-left-color:var(--pen)}
.ticks i.done + i:not(.done){border-left-color:var(--pen)}
.ticks i.now{height:14px;background:var(--pen)}
.qtext{font:400 27px/1.32 var(--serif);margin:0 0 30px;max-width:30em}
.opts{list-style:none;margin:0;padding:0;border-top:1px solid rgba(24,34,45,.28)}
.opt{display:grid;grid-template-columns:54px 1fr;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid rgba(24,34,45,.28);
  background:transparent;padding:15px 10px 15px 0;font:400 20px/1.35 var(--serif);min-height:62px}
.opt:hover:not(:disabled){background:rgba(255,255,255,.4)}
.opt:disabled{cursor:default}
.opt .k{position:relative;width:40px;height:40px;display:grid;place-items:center;font:italic 400 21px/1 var(--serif);margin-left:4px}
.opt .k svg{position:absolute;inset:-5px -7px;width:calc(100% + 14px);height:calc(100% + 10px);overflow:visible;pointer-events:none}
.opt .k path{fill:none;stroke:var(--pen);stroke-width:2.2;stroke-linecap:round}
.opt.sel{color:var(--pen)}
.opt.just .k path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .38s ease-out forwards}
.opt.right{color:var(--ok)} .opt.right .k path{stroke:var(--ok)}
.opt.wrong{color:var(--bad)} .opt.wrong .k path{stroke:var(--bad)}
.opt.wrong .t{text-decoration:line-through;text-decoration-thickness:1.5px}
.opt .mark{font:700 15px/1 var(--sans);margin-left:10px;white-space:nowrap}
.verdict{font:italic 400 20px/1.4 var(--serif);margin:20px 0 0}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:34px;flex-wrap:wrap}
.qfoot .go{display:flex;align-items:center;gap:12px}
.practice-note{font:italic 400 17px/1.4 var(--serif);color:var(--muted);margin:-22px 0 26px}

/* result */
.result-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.grade{font:700 120px/.82 var(--serif);letter-spacing:-.03em;color:var(--pen);white-space:nowrap}
.grade small{font:400 30px/1 var(--serif);color:var(--ink);letter-spacing:0;margin-left:6px}
.rev{padding:16px 0;border-bottom:1px solid rgba(24,34,45,.28)}
.rev .q{font:400 20px/1.35 var(--serif);margin:2px 0 6px}
.rev .ok{color:var(--ok)} .rev .bad{color:var(--bad)}
.rev .bad s{text-decoration-thickness:1.5px}

@media (max-width:600px){
  body{font-size:16px} .sheet{padding:16px 16px 72px} .runhead{margin-bottom:30px}
  h1{font-size:34px} h2{font-size:21px;margin-top:40px} .lede{font-size:19px}
  .fields{grid-template-columns:1fr} .qtext{font-size:22px} .opt{font-size:18px;grid-template-columns:48px 1fr}
  .grade{font-size:88px} .qmap{grid-template-columns:repeat(25,1fr)}
  .plot text{font-size:16px} .plot .lab,.plot .errt{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  .plot .draw,.opt.just .k path{animation:none;stroke-dashoffset:0}
  .plot .late{animation:none;opacity:1}
}
</style>
</head>

  <header class="runhead"><b>KOM1061 practice exam</b><div class="who" id="who"></div></header>
  <main id="app"></main>

// ---------- fair rotation ----------
// Every question is asked once before any is asked twice, twice before any is asked three times, and so on.
// Questions at the lowest ask-count come first in a test, so the rule holds even if a test is left midway.
function pickQuestions(counts){
  const min = Math.min(...counts);
  const low = shuffle(counts.map((v,i)=>v===min?i:-1).filter(i=>i>=0));
  if(low.length >= TEST_SIZE) return low.slice(0,TEST_SIZE);
  const taken = new Set(low);
  const next = shuffle(counts.map((v,i)=>(v===min+1 && !taken.has(i))?i:-1).filter(i=>i>=0));
  return low.concat(next.slice(0, TEST_SIZE-low.length));
}
function rotationInfo(c){
  const min=Math.min(...c.counts), max=Math.max(...c.counts);
  return {round:min+1, done:(min===max?0:c.counts.filter(v=>v>min).length), total:N, min};
}

// Step response of an underdamped second-order system that settles at the score.
function stepPlot(score){
  const W=700,H=330,l=46,r=18,t=14,b=34, pw=W-l-r, ph=H-t-b, ymax=125, T=10;
  const X=x=>l+x/T*pw, Y=y=>t+ph-(y/ymax)*ph;
  const z=0.42, wn=1.55, wd=wn*Math.sqrt(1-z*z);
  let d="";
  for(let k=0;k<=220;k++){ const x=k/220*T; const y=score*(1-Math.exp(-z*wn*x)*(Math.cos(wd*x)+z/Math.sqrt(1-z*z)*Math.sin(wd*x)));
    d+=(k?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1); }
  const gl=[25,50,75].map(v=>`<line class="gl" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("");
  const err=100-score;
  const errMark = err>0 ? `<g class="late"><line class="err" x1="${X(8.3)}" x2="${X(8.3)}" y1="${Y(100)+2}" y2="${Y(score)-2}"/>
      <line class="err" x1="${X(8.3)-5}" x2="${X(8.3)+5}" y1="${Y(100)+2}" y2="${Y(100)+2}"/><line class="err" x1="${X(8.3)-5}" x2="${X(8.3)+5}" y1="${Y(score)-2}" y2="${Y(score)-2}"/>
      <text class="errt" x="${X(8.3)-10}" y="${(Y(100)+Y(score))/2+5}" text-anchor="end">${err>=12?"steady-state error "+err:"error "+err}</text></g>` : "";
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Step response plot settling at your score of ${score} out of 100">
    ${gl}
    <line class="target" x1="${l}" x2="${W-r}" y1="${Y(100)}" y2="${Y(100)}"/>
    <text x="${l-8}" y="${Y(100)+4}" text-anchor="end">100</text><text x="${l-8}" y="${Y(0)+4}" text-anchor="end">0</text>
    <text class="lab" x="${l+8}" y="${Y(100)-8}">target</text>
    <path class="ax" d="M${l} ${t} V${t+ph} H${W-r}"/>
    <text x="${W-r}" y="${H-8}" text-anchor="end">time</text>
    <path class="trace draw" pathLength="1" d="${d}"/>
    ${errMark}
    <text class="lab late" x="${W-r}" y="${Y(score)+(score>=14?20:-10)}" text-anchor="end" style="fill:var(--pen);font-weight:700">your score: ${score}</text>
  </svg>`;
}
// Discrete-time stem plot of past scores, one stem per test.
function stemPlot(tests){
  const show=tests.slice(-30), off=tests.length-show.length;
  const W=700,H=220,l=46,r=18,t=14,b=38, pw=W-l-r, ph=H-t-b;
  const n=show.length, step=pw/Math.max(n,8), X=k=>l+step*(k+0.5), Y=y=>t+ph-(y/100)*ph;
  const avg=show.reduce((a,x)=>a+x.score*5,0)/n;
  const every = n>20?5:(n>10?2:1);
  const stems=show.map((x,k)=>{const s=x.score*5; const lab=((off+k+1)%every===0||n<=10)?`<text x="${X(k)}" y="${H-16}" text-anchor="middle">${off+k+1}</text>`:"";
    return `<line x1="${X(k)}" x2="${X(k)}" y1="${Y(0)}" y2="${Y(s)}" stroke="var(--pen)" stroke-width="2"/><circle cx="${X(k)}" cy="${Y(s)}" r="4.5" fill="var(--pen)"><title>Test ${off+k+1}: ${s}</title></circle>${lab}`;}).join("");
  const gl=[50,100].map(v=>`<line class="gl" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("");
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scores of your last ${n} tests, average ${Math.round(avg)}">
    ${gl}<text x="${l-8}" y="${Y(0)+4}" text-anchor="end">0</text>
    <line class="target" x1="${l}" x2="${W-r}" y1="${Y(avg)}" y2="${Y(avg)}"/>
    <text class="lab" x="${W-r}" y="${Y(avg)-7}" text-anchor="end">average ${Math.round(avg)}</text>
    <path class="ax" d="M${l} ${t} V${t+ph} H${W-r}"/>
    ${stems}<text x="${W-r}" y="${H-1}" text-anchor="end">test number</text></svg>`;
}

  ${c.tests.map((t,i)=>({t,i})).reverse().slice(0,12).map(({t,i})=>`<tr><td>${i+1}</td><td>${fmtDate(t.date)}</td><td class="num">${t.score} of ${t.items.length}</td><td class="num"><b>${t.score*5}</b></td><td class="num"><button class="textbtn" onclick="showReview(${i})">Review</button></td></tr>`).join("")}
  </tbody></table>${c.tests.length>12?`<p class="muted small" style="margin-top:8px">Showing the latest 12 tests.</p>`:""}`:""}

  <h2>Your data</h2>
  <div class="links">
    <button class="textbtn" onclick="exportData()">Export progress</button>
    <button class="textbtn" onclick="document.getElementById('importFile').click()">Import progress</button>
    <button class="textbtn danger" onclick="resetMe()">Reset my progress</button>
  </div>`);
}

function buildRun(ids, mode){
  return {mode, ids, orders: ids.map(()=>shuffle([0,1,2,3])), answers: ids.map(()=>null), idx:0, started:Date.now()};
}
function startTest(){
  const c=cand(); ensureCounts(c); practiceRun=null;
  c.active = buildRun(pickQuestions(c.counts), "test"); save(); showQuestion();
}
function resumeTest(){ practiceRun=null; showQuestion(); }
let practiceRun=null;
function startPractice(kind, testIndex){
  const c=cand(); let ids;
  if(kind==="wrong") ids = Object.keys(c.res).filter(id=>c.res[id]===0).map(Number);
  else { const t=c.tests[testIndex]; ids=t.items.filter(it=>it.sel!==0).map(it=>it.q); }
  ids = shuffle(ids).slice(0, TEST_SIZE);
  if(!ids.length) return;
  practiceRun = buildRun(ids,"practice"); showQuestion();
}
function run(){ return practiceRun || cand().active; }

function showQuestion(justJ){
  const R=run(); const i=R.idx; const qid=R.ids[i]; const q=QUESTIONS[qid];
  const opts=R.orders[i].map(o=>q[2+o]); // q = [topic, question, correct, w1, w2, w3]; option 0 is the correct one
  const sel=R.answers[i]; const practice=R.mode==="practice";
  const revealed = practice && sel!==null;
  const last = i===R.ids.length-1;
  const keep = justJ!==undefined;
  const html = `
  <div class="qmeta"><span>Question ${i+1} of ${R.ids.length}</span><span class="topic">${esc(q[0])}</span></div>
  <div class="ticks" aria-hidden="true">${R.ids.map((_,k)=>`<i class="${k<i?"done":k===i?"now":""}"></i>`).join("")}</div>
  ${practice?'<p class="practice-note">Practice round. It does not change your scores or the question map.</p>':""}
  <p class="qtext">${esc(q[1])}</p>
  <ol class="opts" id="opts">${opts.map((t,j)=>{
    let cls="opt", mark="", circ="";
    if(revealed){
      if(R.orders[i][j]===0){ cls+=" right"; circ=CIRCLE; mark='<span class="mark">correct</span>'; }
      else if(j===sel){ cls+=" wrong"; circ=CIRCLE; mark='<span class="mark">your answer</span>'; }
    } else if(j===sel){ cls+=" sel"+(j===justJ?" just":""); circ=CIRCLE; }
    return `<li><button class="${cls}" data-j="${j}" ${revealed?"disabled":""} aria-pressed="${j===sel}"><span class="k">${"abcd"[j]}${circ}</span><span><span class="t">${esc(t)}</span>${mark}</span></button></li>`;}).join("")}</ol>
  ${revealed? (R.orders[i][sel]===0?'<p class="verdict ok">Correct.</p>':'<p class="verdict bad">Not this time. The right answer is circled in green.</p>'):""}
  <div class="qfoot">
    <button class="textbtn" onclick="quitRun()">${practice?"End practice":"Save and exit"}</button>
    <div class="go"><span class="muted small">${sel===null?'Press <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> to answer':'<kbd>Enter</kbd>'}</span>
    <button class="btn primary" id="nextBtn" ${sel===null?"disabled":""}>${last?(practice?"Finish practice":"Finish the test"):"Next question"}</button></div>
  </div>`;
  if(keep){ const y=window.scrollY; screen="question"; $app.innerHTML=html; window.scrollTo(0,y); } else render("question", html);
  document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>choose(Number(b.dataset.j)));
  document.getElementById("nextBtn").onclick=nextQ;
}
function choose(j){
  const R=run(); const i=R.idx;
  if(R.mode==="practice" && R.answers[i]!==null) return;
  if(j<0||j>3) return;
  R.answers[i]=j; if(R.mode==="test") save(); showQuestion(j);
}
function nextQ(){
  const R=run(); const i=R.idx; const qid=R.ids[i];
  if(R.answers[i]===null) return;
  const correct = R.orders[i][R.answers[i]]===0 ? 1 : 0;
  const c=cand();
  if(R.mode==="test"){ c.counts[qid]++; c.res[qid]=correct; c.updated=Date.now(); }
  else if(correct) c.res[qid]=1; // a fixed mistake leaves the mistakes list
  R.idx++; save();
  if(R.idx>=R.ids.length) finishRun(); else showQuestion();
}
function quitRun(){ practiceRun=null; save(); showDashboard(); }

function finishRun(){
  const R=run(); const c=cand();
  const items=R.ids.map((q,i)=>({q, order:R.orders[i], sel:R.orders[i][R.answers[i]]})); // sel 0 = correct
  const score=items.filter(it=>it.sel===0).length;
  if(R.mode==="test"){ c.tests.push({date:Date.now(), score, items}); c.active=null; save(); showResult(c.tests.length-1); }
  else { practiceRun=null; save(); showResult(null, {score, items}); }
}
function gradeMsg(p){
  if(p>=90) return "Almost no steady-state error. Excellent.";
  if(p>=75) return "A strong response with a small error left to remove.";
  if(p>=60) return "A solid response, with room to close the gap.";
  if(p>=45) return "Past the halfway mark. Practicing your mistakes will close the gap fastest.";
  return "A large error for now. Review the answers below, then practice your mistakes.";
}
function showResult(ti, prac){
  const c=cand(); const t = prac || c.tests[ti]; const n=t.items.length;
  const pts = Math.round(t.score/n*100);
  const byTopic={};
  t.items.forEach(it=>{ const tp=QUESTIONS[it.q][0]; byTopic[tp]=byTopic[tp]||[0,0]; byTopic[tp][1]++; if(it.sel===0) byTopic[tp][0]++; });
  const wrong=n-t.score; const r=rotationInfo(c);
  render("result", `
  <div class="result-top">
    <div><p class="qmeta" style="margin-bottom:6px"><span>${prac?"Practice round":"Test "+(ti+1)}, ${esc(c.first+" "+c.last)}</span></p>
    <h1 style="margin:0">${prac?"Practice finished":"Your grade"}</h1></div>
    <div class="grade">${pts}<small>/ 100</small></div>
  </div>
  ${stepPlot(pts)}
  <p class="lede" style="margin-top:16px">${t.score} correct and ${wrong} wrong out of ${plural(n,"question")}. ${gradeMsg(pts)}</p>
  <div class="actions">
    <button class="btn primary" id="mainBtn" onclick="startTest()">Start the next test</button><kbd>Enter</kbd>
    ${!prac && wrong? `<button class="btn" onclick="startPractice('test',${ti})">Retry the ${plural(wrong,"mistake")}</button>`:""}
    ${prac? "" : `<button class="btn" onclick="showReview(${ti})">Review answers</button>`}
  </div>
  <div class="links" style="margin-top:18px"><button class="textbtn" onclick="showDashboard()">Go to the dashboard</button><button class="textbtn" onclick="logout()">Switch candidate</button></div>

  <h2>By topic</h2>
  <table><thead><tr><th>Topic</th><th class="num">Correct</th></tr></thead><tbody>
    ${Object.entries(byTopic).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v[0]} of ${v[1]}</td></tr>`).join("")}
  </tbody></table>
  ${prac?"":`<p class="muted small" style="margin-top:14px">Round ${r.round}: ${r.done} of ${r.total} questions asked.</p>`}
  ${prac? reviewHTML(t) : ""}`);
}
function reviewHTML(t){
  return `<h2>Answer review</h2>${t.items.map((it,k)=>{
    const q=QUESTIONS[it.q]; const ok=it.sel===0;
    return `<div class="rev"><div class="muted small">${k+1}. ${esc(q[0])}</div><p class="q">${esc(q[1])}</p>
      ${ok?`<div class="ok">Your answer, correct: ${esc(q[2])}</div>`
          :`<div class="bad">Your answer: <s>${esc(q[2+it.sel])}</s></div><div class="ok">Correct answer: ${esc(q[2])}</div>`}</div>`;}).join("")}`;
}
function showReview(ti){
  const c=cand(); const t=c.tests[ti];
  render("review", `<p class="qmeta"><span>Test ${ti+1}, ${fmtDate(t.date)}</span></p>
  <h1>${t.score*5} out of 100</h1><p class="lede">${t.score} of ${t.items.length} correct.</p>
  <div class="actions"><button class="btn primary" id="mainBtn" onclick="startTest()">Start the next test</button><button class="btn" onclick="showDashboard()">Go to the dashboard</button></div>` + reviewHTML(t));
}
function resetMe(){
  const c=cand();
  if(!confirm("Delete all progress, scores and history for "+c.first+" "+c.last+"?")) return;
  c.counts=Array(N).fill(0); c.res={}; c.tests=[]; c.active=null; save(); showDashboard();
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="kom1061-quiz-progress.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById("importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{
    try{ const d=JSON.parse(rd.result); if(!d.cands) throw 0;
      for(const k in d.cands) DB.cands[k]=d.cands[k];
      save(); alert("Progress imported."); DB.lastKey&&DB.cands[DB.lastKey]?showDashboard():showLogin();
    }catch(err){ alert("This file isn't a progress export from this exam."); }
  }; rd.readAsText(f); e.target.value="";
};

// ---------- keyboard ----------
// Enter works like the main button on each screen; A–D or 1–4 pick an answer.
document.addEventListener("keydown", e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return;
  const el=document.activeElement; const tag=el?el.tagName:"";
  if(tag==="INPUT"||tag==="TEXTAREA") return;                 // typing a name: the form handles Enter
  if(screen==="question"){
    const k=e.key.toLowerCase();
    const j="abcd".indexOf(k)>=0&&k.length===1 ? "abcd".indexOf(k) : ("1234".indexOf(k)>=0&&k.length===1 ? "1234".indexOf(k) : -1);
    if(j>=0){ e.preventDefault(); choose(j); return; }
    if(e.key==="Enter"){
      if(tag==="BUTTON" && el.classList.contains("textbtn")) return;   // let "Save and exit" work normally
      e.preventDefault();
      const R=run();
      if(R.answers[R.idx]===null){ if(tag==="BUTTON" && el.classList.contains("opt")) choose(Number(el.dataset.j)); return; }
      nextQ();
    }
    return;
  }
  if(e.key==="Enter" && (tag!=="BUTTON")){
    const b=document.getElementById("mainBtn"); if(b){ e.preventDefault(); b.click(); }
  }
});

// ---------- start ----------
if(DB.lastKey && DB.cands[DB.lastKey]){ ensureCounts(cand()); showDashboard(); } else showLogin();
</script>
